[project]
name = "backend"
version = "0.0.2"
description = "PingArchive backend"
readme = "README.md"
requires-python = "==3.14.5"
dependencies = [
    "alembic==1.18.4",
    "cryptography==49.0.0",
    "fastapi==0.138.0",
    "httpx==0.28.1",
    "pip==26.1.2",
    "pydantic==2.13.4",
    "pytest==9.0.2",
    "python-dotenv==1.0.0",
    "sqlalchemy==2.0.51",
    "typer==0.21.1",
    "uvicorn==0.49.0",
]

[dependency-groups]
dev = [
    "basedpyright==1.39.8",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.4.0",
    "pytest-cov==7.0.0",
    "ruff==0.15.19",
]

[tool.ruff]
line-length = 140
target-version = "py314"
format.preview = true
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.basedpyright]
extraPaths = ["src"]
include = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["focus"]
addopts = "-s --log-cli-level=INFO -vv"
asyncio_mode = "auto"
