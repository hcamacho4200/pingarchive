services:
  questdb:
    image: questdb/questdb:latest
    container_name: questdb
    restart: unless-stopped
    volumes:
      - ./questdb:/var/lib/questdb
    environment:
      ENVIRONMENT: "PROD"
      QUEST_DB_ADDRESS: "qwestdb:9000"
  frontend:
    build:
      context: ../frontend
      args:
        NEXT_PUBLIC_API_URL: /api/v1
    image: pingarchive-frontend:testing
    container_name: pingarchive-frontend
    restart: unless-stopped
    depends_on:
      - backend
  backend:
    image: pingarchive-backend:testing
    container_name: pingarchive-backend
    restart: unless-stopped
    environment:
      API_BIND_HOST: 0.0.0.0
      API_BIND_PORT: 8002
      API_RELOAD: "false"
      API_WORKERS: 1
      DATABASE_URL: sqlite:///data/pingarchive.db
      QWEST_DB_ADDRESS: questdb:9000
      PING_ENGINE_HOST: engine
      PING_ENGINE_PORT: 8100
    volumes:
      - ./backend-data:/app/data
    depends_on:
      - questdb 
  
  engine:
    build:
      context: ../pingarchive-ping-engine
    image: pingarchive-engine:testing
    container_name: pingarchive-engine
    restart: unless-stopped
    cap_add:
      - NET_RAW
    sysctls:
      net.ipv4.ping_group_range: "0 2147483647"
    depends_on:
      - backend
      - questdb
    environment:
      ENVIRONMENT: "PROD"
      API_BIND_HOST: backend
      API_BIND_PORT: 8002
      PING_CONTROL_SERVER_LISTEN_ADDRESS: "0.0.0.0:8100"
      QWEST_DB_ADDRESS: "questdb:9000"


  proxy:
    image: nginx:alpine
    container_name: pingarchive-proxy
    restart: unless-stopped
    ports:
      - "3001:3000"
    depends_on:
      - frontend
      - backend
    command:
      - /bin/sh
      - -c
      - |
        cat > /etc/nginx/conf.d/default.conf <<'EOF'
        server {
            listen 3000;
            server_name _;

            location /api/ {
                proxy_pass http://backend:8002;
                proxy_http_version 1.1;

                proxy_set_header Host $$host;
                proxy_set_header X-Real-IP $$remote_addr;
                proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $$scheme;
            }

            location /ws/ {
                proxy_pass http://backend:8002;
                proxy_http_version 1.1;

                proxy_set_header Upgrade $$http_upgrade;
                proxy_set_header Connection "upgrade";
                proxy_set_header Host $$host;
            }

            location / {
                proxy_pass http://frontend:3000;
                proxy_http_version 1.1;

                proxy_set_header Host $$host;
                proxy_set_header X-Real-IP $$remote_addr;
                proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $$scheme;
            }
        }
        EOF

        exec nginx -g 'daemon off;'
